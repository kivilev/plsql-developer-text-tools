<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Text Tools for PL/SQL Developer">
  <title>Text Tools for PL/SQL Developer</title>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#1E293B"/>
  <!-- selection highlight behind the lower-case t -->
  <rect x="66" y="40" width="34" height="56" rx="6" fill="#0EA5A4" opacity="0.35"/>
  <text x="25" y="88" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="62" font-weight="700" fill="#F8FAFC">T</text>
  <text x="68" y="88" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="62" font-weight="700" fill="#5EEAD4">t</text>
  <!-- text cursor -->
  <rect x="103" y="38" width="5" height="60" rx="2" fill="#F8FAFC"/>
</svg>
