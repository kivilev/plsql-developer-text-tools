name: Bug report
description: Something in Text Tools does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The fix will be committed as `fix[#<this issue number>]: ...`.
        Questions are welcome in Discussions; security problems go to private reporting (see SECURITY.md).
  - type: checkboxes
    id: latest
    attributes:
      label: Checks
      options:
        - label: I use the latest release of Text Tools
          required: true
        - label: I searched existing issues
          required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Configure > Plug-Ins > Text Tools > About
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: ide-version
    attributes:
      label: PL/SQL Developer version
      description: Help > About; must be the 64-bit edition
      placeholder: "16.0.2 x64"
    validations:
      required: true
  - type: dropdown
    id: menu-style
    attributes:
      label: Menu style
      options:
        - Ribbon
        - Classic menu
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
  - type: input
    id: command
    attributes:
      label: Menu command
      placeholder: "Date Tools > Date -> TO_DATE(...)"
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Selected text (input)
      description: Paste the exact text you selected. Remove anything confidential.
      render: sql
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      render: sql
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Resulting text, status bar message, error dialog text, or "IDE crashed".
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Tabs or Cyrillic in the text, selection direction, whether Ctrl+Z restored the text, etc.
