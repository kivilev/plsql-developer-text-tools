# The plug-in self test inside a real PL/SQL Developer, one throwaway Windows VM per IDE version (12-17, the x64
# editions; the plug-in is x64 only). Runs by hand and on pull requests that touch the IDE interop.
# Installers are downloaded from Allround Automations into the Actions cache - never committed: the license forbids
# redistributing them. Each version runs as its built-in trial. Results (result.json, selftest.json, screenshots,
# install log) are uploaded per version.
name: real-ide

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/TextTools.Plugin/**
      - scripts/real-ide-smoke.ps1
      - .github/workflows/real-ide.yml

permissions:
  contents: read

concurrency:
  group: real-ide-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Build the plug-in (Native AOT)
        shell: pwsh
        run: |
          $env:PATH = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer;$env:PATH"
          dotnet publish src/TextTools.Plugin -c Release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: plugin-dll
          path: src/TextTools.Plugin/bin/Release/net10.0/win-x64/publish/PlsqlDevTextTools.dll
          if-no-files-found: error

  ide:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The trial page offers the current build only; older builds come from the registered-download page
          # (each runs as a trial without a license key). Exact builds: a new release 404s the old link until the
          # cache is evicted - then update from https://www.allroundautomations.com/try-it-free/ and /registered-plsqldev/.
          - { version: '17', msi: plsqldev1703x64.msi, url: 'https://www.allroundautomations.com/files/trial/plsqldev1703x64.msi' }
          - { version: '16', msi: plsqldev1608x64.msi, url: 'https://www.allroundautomations.com/files/registered/plsqldev1608x64.msi' }
          - { version: '15', msi: plsqldev1504x64.msi, url: 'https://www.allroundautomations.com/files/registered/plsqldev1504x64.msi' }
          - { version: '14', msi: plsqldev1406x64.msi, url: 'https://www.allroundautomations.com/files/registered/plsqldev1406x64.msi' }
          - { version: '13', msi: plsqldev1306x64.msi, url: 'https://www.allroundautomations.com/files/plsqldev1306x64.msi' }
          - { version: '12', msi: plsqldev1207x64.msi, url: 'https://www.allroundautomations.com/files/plsqldev1207x64.msi' }
    name: PL/SQL Developer ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: plugin-dll
          path: plugin
      - name: Cache the installer
        id: msi
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/${{ matrix.msi }}
          key: plsqldev-${{ matrix.msi }}
      - name: Download the installer
        if: steps.msi.outputs.cache-hit != 'true'
        shell: pwsh
        run: curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\${{ matrix.msi }}" "${{ matrix.url }}"
      # Without an Oracle client the IDE opens a modal "Oracle Client Wizard" on the first start.
      - name: Cache Oracle Instant Client
        id: oci
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/instantclient-basiclite-windows.zip
          # The URL is Oracle's rolling "latest" link: the cache freezes one version on purpose (stable runs);
          # bump the key suffix to take a newer client.
          key: oracle-instantclient-basiclite-windows-x64-v1
      - name: Download Oracle Instant Client
        if: steps.oci.outputs.cache-hit != 'true'
        shell: pwsh
        run: curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\instantclient-basiclite-windows.zip" https://download.oracle.com/otn_software/nt/instantclient/instantclient-basiclite-windows.zip
      - name: Install Oracle Instant Client
        shell: pwsh
        run: |
          Expand-Archive "$env:RUNNER_TEMP\instantclient-basiclite-windows.zip" C:\oracle -Force
          $ic = (Get-ChildItem C:\oracle -Directory -Filter 'instantclient_*' | Select-Object -First 1).FullName
          "Instant Client: $ic"
          $ic | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install, start, run the plug-in self test
        shell: pwsh
        run: ./scripts/real-ide-smoke.ps1 -Msi "$env:RUNNER_TEMP\${{ matrix.msi }}" -Dll plugin/PlsqlDevTextTools.dll -Out real-ide
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: real-ide-${{ matrix.version }}
          path: real-ide/
          if-no-files-found: warn
